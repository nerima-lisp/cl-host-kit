name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write # Push the update branch.
  pull-requests: write # Open the update PR.

# Serialize scheduled and manual updates.
concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reuse the shared Nix setup.
      - uses: ./.github/actions/nix-setup

      - name: Update and check flake.lock
        run: |
          set -euo pipefail
          nix flake update
          nix flake check --print-build-logs

      # Open a PR only for the checked lock-file change.
      - name: Create flake.lock update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          add-paths: flake.lock
          branch: automation/update-flake-lock
          delete-branch: true
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
